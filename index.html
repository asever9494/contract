<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울특별시교육청 계약업무 챗봇</title></head><body><div id="loading" style="font-family:sans-serif;padding:40px;text-align:center">계약업무 챗봇을 불러오는 중입니다...</div><script>(async()=>{try{const files=['.app/p00.txt','.app/p01.txt','.app/p02.txt','.app/p03.txt','.app/p04.txt'];const parts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+' 로드 실패');return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('loading').innerHTML='<b>챗봇 로딩 오류</b><br>'+e.message}})();</script></body></html>
